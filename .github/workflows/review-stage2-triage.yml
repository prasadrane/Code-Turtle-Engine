name: Code Turtle Stage 2 - Triage
on:
  workflow_run:
    workflows: ["Code Turtle Stage 1 - Extract"]
    types: [completed]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0] != null }}
    steps:
      - name: Checkout Trusted Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download Artifacts from Stage 1
        uses: actions/download-artifact@v4
        with:
          name: turtle-artifacts
          path: downloaded-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate PR and Run Grounded Review
        id: review
        env:
          TURTLE_LLM_BASE_URL: ${{ secrets.TURTLE_LLM_BASE_URL }}
          TURTLE_LLM_API_KEY: ${{ secrets.TURTLE_LLM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.workflow_run.pull_requests[0];
            if (!pr || !pr.number) {
              throw new Error("No associated pull request found in trusted workflow run event.");
            }
            const prNumber = pr.number;
            const headSha = pr.head.sha;
            if (!/^[0-9a-fA-F]{40}$/.test(headSha)) {
              throw new Error("Invalid commit SHA: " + headSha);
            }

            // Verify with GitHub API that PR head SHA matches
            const { data: currentPr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            if (currentPr.head.sha !== headSha) {
              core.warning(`PR head SHA changed from ${headSha} to ${currentPr.head.sha}; skipping stale run.`);
              return;
            }

            core.setOutput("pr_number", prNumber.toString());
            core.setOutput("head_sha", headSha);

      - name: Generate Review from Extracted Payload
        if: steps.review.outputs.pr_number != ''
        env:
          TURTLE_LLM_BASE_URL: ${{ secrets.TURTLE_LLM_BASE_URL }}
          TURTLE_LLM_API_KEY: ${{ secrets.TURTLE_LLM_API_KEY }}
        run: |
          dotnet build -c Release
          dotnet run -c Release --no-build --project src/CodeTurtleEngine.Cli -- review . --payload downloaded-artifacts/payload.json --out review.md

      - name: Post or Update PR Comment
        if: steps.review.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const prNumber = parseInt('${{ steps.review.outputs.pr_number }}', 10);
            if (!fs.existsSync('review.md')) {
              console.log('No review.md generated.');
              return;
            }
            const body = fs.readFileSync('review.md', 'utf8');
            const marker = '<!-- code-turtle-review -->';
            const taggedBody = `${body}\n\n${marker}`;

            // Check for existing review comments to update instead of spamming
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: taggedBody
              });
              console.log(`Updated comment ${existing.id} on PR #${prNumber}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: taggedBody
              });
              console.log(`Created new comment on PR #${prNumber}`);
            }
