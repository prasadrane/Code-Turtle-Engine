name: Code Turtle Stage 2 - Triage
on:
  workflow_run:
    workflows: ["Code Turtle Stage 1 - Extract"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: turtle-review-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  triage:
    # Explicit operator opt-in; no PR comments or other publication permissions.
    if: ${{ vars.CODETURTLE_REVIEW_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted reviewer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup trusted SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/code-turtle-dotnet
      - name: Publish trusted reviewer and isolated worker
        run: |
          test "$DOTNET_ROOT" = "$RUNNER_TEMP/code-turtle-dotnet"
          test "$(command -v dotnet)" = "$DOTNET_ROOT/dotnet"
          # Populate the approved feed for the default solution, including tests.
          # This is the trusted checkout; PR projects are restored only in workers.
          dotnet restore CodeTurtleEngine.sln
          dotnet publish src/CodeTurtleEngine.Worker -c Release -o "$RUNNER_TEMP/worker-publish"
          dotnet publish src/CodeTurtleEngine.Cli -c Release -o "$RUNNER_TEMP/cli-publish"
          mkdir "$RUNNER_TEMP/offline-feed"
          find "$HOME/.nuget/packages" -type f -name '*.nupkg' -exec cp '{}' "$RUNNER_TEMP/offline-feed/" ';'
          python3 tools/build_worker.py --dotnet-root "$DOTNET_ROOT" --published "$RUNNER_TEMP/worker-publish" --packages "$RUNNER_TEMP/offline-feed" --context "$RUNNER_TEMP/worker-image"
      - name: Review the same pinned archive through analysis and audit
        env:
          GH_TOKEN: ${{ github.token }}
          TURTLE_LLM_API_KEY: ${{ secrets.TURTLE_LLM_API_KEY }}
          TURTLE_LLM_BASE_URL: ${{ vars.TURTLE_LLM_BASE_URL }}
          REVIEW_PROJECT: ${{ vars.CODETURTLE_REVIEW_PROJECT }}
        run: |
          python3 tools/github_isolated_review.py --event "$GITHUB_EVENT_PATH" --image-file "$RUNNER_TEMP/worker-image/image-id.txt" --cli "$RUNNER_TEMP/cli-publish/CodeTurtleEngine.Cli.dll" --project "${REVIEW_PROJECT:-CodeTurtleEngine.sln}" --out "$RUNNER_TEMP/review-result"
      - name: Retain isolated review result
        uses: actions/upload-artifact@v4
        with:
          name: turtle-isolated-review-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/review-result/
          retention-days: 7
