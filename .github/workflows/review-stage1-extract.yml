name: Code Turtle Stage 1 - Extract
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Notification only. PR code and PR-produced artifacts never enter the trusted job.
permissions: {}
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Request pinned isolated review
        run: echo 'Trusted Stage 2 acquires the pinned PR revision independently.'
