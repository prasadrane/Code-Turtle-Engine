name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      TURTLE_LIVE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build --configuration Release -m:2
      - run: dotnet test --configuration Release --no-build -m:2
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/tooling -v
  worker-isolation:
    runs-on: ubuntu-24.04
    env:
      TURTLE_LIVE: '0'
      DOTNET_INSTALL_DIR: ${{ runner.temp }}/code-turtle-dotnet
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          # The worker image builder requires this exact installed SDK directory.
          dotnet-version: '10.0.100'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify worker SDK installation
        run: |
          command -v dotnet
          test "$DOTNET_ROOT" = "$DOTNET_INSTALL_DIR"
          test "$(command -v dotnet)" = "$DOTNET_INSTALL_DIR/dotnet"
          dotnet --list-sdks
          du -sh "$DOTNET_ROOT"
      - run: dotnet publish src/CodeTurtleEngine.Worker -c Release -m:2 -o work/worker/app
      - run: dotnet pack tests/fixtures/OfflinePackage -c Release -m:2 -o work/offline-feed
      - run: python tools/build_worker.py --dotnet-root "$DOTNET_ROOT" --published work/worker/app --packages work/offline-feed --context work/worker-image
      - run: |
          export TURTLE_WORKER_IMAGE="$(cat work/worker-image/image-id.txt)"
          python -m unittest discover -s tests/tooling -p 'test_worker*.py' -v
          python tools/fixture_matrix.py --image "$TURTLE_WORKER_IMAGE" --out work/fixture-matrix
